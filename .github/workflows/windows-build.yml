name: Windows build

on:
  push:
    branches:
      - main
      - feat/wx-serial-terminal
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download wxWidgets
        shell: cmd
        run: setup_wxwidgets.bat

      - name: Configure
        shell: cmd
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - name: Build helper tests
        shell: cmd
        run: cmake --build build --config Debug --target SerialHelpersTests

      - name: Run helper tests
        shell: cmd
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Build application
        shell: cmd
        run: cmake --build build --config Release --target SerialTest
